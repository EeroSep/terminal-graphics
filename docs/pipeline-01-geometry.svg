<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" role="img" aria-label="Six sequential steps process one face at a time, then loop back for the next face across every object, feeding a shared triangle buffer.">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 8,4 0,8" fill="#12211c" fill-opacity=".7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="270" fill="#f2f6f4"/>

  <g font-family="-apple-system, 'Segoe UI', sans-serif">
    <g>
      <rect x="30" y="102" width="140" height="56" rx="4" fill="#ffffff" stroke="#cfdbd5" stroke-width="1.4"/>
      <rect x="30" y="102" width="140" height="5" fill="#a15d00"/>
      <text x="42" y="124" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="600" fill="#57685f">01</text>
      <text x="100" y="140" text-anchor="middle" font-size="12.5" font-weight="600" fill="#12211c">backface cull</text>
    </g>
    <g>
      <rect x="190" y="102" width="140" height="56" rx="4" fill="#ffffff" stroke="#cfdbd5" stroke-width="1.4"/>
      <rect x="190" y="102" width="140" height="5" fill="#a15d00"/>
      <text x="202" y="124" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="600" fill="#57685f">02</text>
      <text x="260" y="140" text-anchor="middle" font-size="12.5" font-weight="600" fill="#12211c">shade</text>
    </g>
    <g>
      <rect x="350" y="102" width="140" height="56" rx="4" fill="#ffffff" stroke="#cfdbd5" stroke-width="1.4"/>
      <rect x="350" y="102" width="140" height="5" fill="#a15d00"/>
      <text x="362" y="124" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="600" fill="#57685f">03</text>
      <text x="420" y="140" text-anchor="middle" font-size="12.5" font-weight="600" fill="#12211c">to clip space</text>
    </g>
    <g>
      <rect x="510" y="102" width="140" height="56" rx="4" fill="#ffffff" stroke="#cfdbd5" stroke-width="1.4"/>
      <rect x="510" y="102" width="140" height="5" fill="#a15d00"/>
      <text x="522" y="124" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="600" fill="#57685f">04</text>
      <text x="580" y="140" text-anchor="middle" font-size="12.5" font-weight="600" fill="#12211c">frustum cull</text>
    </g>
    <g>
      <rect x="670" y="102" width="140" height="56" rx="4" fill="#ffffff" stroke="#cfdbd5" stroke-width="1.4"/>
      <rect x="670" y="102" width="140" height="5" fill="#a15d00"/>
      <text x="682" y="124" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="600" fill="#57685f">05</text>
      <text x="740" y="140" text-anchor="middle" font-size="12.5" font-weight="600" fill="#12211c">near clip</text>
    </g>
    <g>
      <rect x="830" y="102" width="140" height="56" rx="4" fill="#ffffff" stroke="#cfdbd5" stroke-width="1.4"/>
      <rect x="830" y="102" width="140" height="5" fill="#a15d00"/>
      <text x="842" y="124" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="600" fill="#57685f">06</text>
      <text x="900" y="140" text-anchor="middle" font-size="12.5" font-weight="600" fill="#12211c">project</text>
    </g>

    <line x1="170" y1="130" x2="188" y2="130" stroke="#12211c" stroke-opacity=".55" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="330" y1="130" x2="348" y2="130" stroke="#12211c" stroke-opacity=".55" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="490" y1="130" x2="508" y2="130" stroke="#12211c" stroke-opacity=".55" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="650" y1="130" x2="668" y2="130" stroke="#12211c" stroke-opacity=".55" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="810" y1="130" x2="828" y2="130" stroke="#12211c" stroke-opacity=".55" stroke-width="1.6" marker-end="url(#arrow)"/>

    <polyline points="900,158 900,175 500,175 500,196" fill="none" stroke="#12211c" stroke-opacity=".55" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="444" y="212" width="80" height="18" rx="2" fill="#ffffff" stroke="#cfdbd5" stroke-width="1.2"/>
    <rect x="452" y="204" width="80" height="18" rx="2" fill="#ffffff" stroke="#cfdbd5" stroke-width="1.2"/>
    <rect x="460" y="196" width="80" height="18" rx="2" fill="#ffffff" stroke="#12211c" stroke-width="1.4"/>
    <text x="500" y="248" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12.5" font-weight="600" fill="#12211c">triangleBuffer</text>

    <polyline points="500,230 500,250 100,250 100,158" fill="none" stroke="#12211c" stroke-opacity=".5" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="300" y="244" text-anchor="middle" font-size="10.5" fill="#57685f">next face &#8594;</text>
  </g>
</svg>
